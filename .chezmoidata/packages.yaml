# Packages installed on `chezmoi apply`, per package manager. Add a name to a
# list and the next apply installs it; run_onchange_after_install-packages.*
# reruns whenever this file changes. Removing a name does not uninstall it.
#
# Only the lists for this OS's manager are used:
#   choco  - Windows (needs an elevated shell)
#   brew   - macOS
#   apt    - Debian/Ubuntu Linux (uses sudo)
packages:
  choco:
    - beyondcompare     # git difftool/mergetool, see dot_gitconfig.tmpl
    - unxutils          # native Win32 GNU utilities (grep, sed, awk, ...)
    - notepadplusplus   # git core.editor, see dot_gitconfig.tmpl
    - uv                # runs handy
    - nodejs-lts
    - fzf
    - ripgrep
  brew:
    formulae:
      - uv
      - node            # current release; brew's LTS formulae are versioned (node@22)
      - fzf
      - ripgrep
    casks:
      - beyond-compare
      - karabiner-elements  # rules in private_dot_config/karabiner, enabled by run_onchange_after_enable-karabiner-rules
  # Not from apt:
  # - Beyond Compare: Scooter Software's .deb, https://www.scootersoftware.com/download
  # - uv: not packaged; https://docs.astral.sh/uv/getting-started/installation/
  # - node: distro versions lag far behind; use nvm or NodeSource
  # - Notepad++: Windows only
  apt:
    - fzf
    - ripgrep
